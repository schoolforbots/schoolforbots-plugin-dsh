name: Release

# Pushing a tag like v0.3.4 stages that version on npm and opens a GitHub release.
# npm trusts this workflow through Trusted Publishing (OIDC), so the repository holds no npm token.
# The trusted publisher may only stage a version (npm stage publish), not publish it: a maintainer
# approves the staged version on npmjs.com (or with npm stage approve) to publish it.
# The tag must match the version in package.json and point at a commit on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag
        id: check
        run: |
          tag="${GITHUB_REF_NAME}"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag is not on main"
            exit 1
          fi
          # A version already on npm (for example one published by hand) only gets the GitHub release.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # npm stage needs a recent npm; the one bundled with Node may be older.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # prepack runs the build, which clears lib/ first.
      - name: Stage on npm
        if: steps.check.outputs.published == 'false'
        run: npm stage publish --provenance --access public --tag "${{ steps.check.outputs.dist_tag }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            prerelease=""
            [ "${{ steps.check.outputs.dist_tag }}" = "next" ] && prerelease="--prerelease"
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
          fi
